<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valorant Mobile Kesin Cozum</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; z-index: 1; }
        
        /* Ekran Katmanları */
        .screen { position: absolute; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f1923; color: #fff; padding: 20px; }
        .hidden { display: none !important; }
        
        /* Ajan Seçimi Alanı Sabitlendi */
        .agent-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; width: 100%; max-width: 500px; }
        .agent-card { background: #1f2326; padding: 12px 20px; border: 2px solid #333; border-radius: 4px; text-align: center; cursor: pointer; font-size: 14px; min-width: 90px; }
        .agent-card.selected { border-color: #ff4655; background: #ff465522; font-weight: bold; }
        .btn { padding: 12px 40px; background: #ff4655; color: white; border: none; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; border-radius: 4px; }
        
        /* HUD Üst Alan */
        #hud-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; background: rgba(15,25,35,0.8); padding: 2px 15px; border-radius: 4px; border-bottom: 2px solid #ff4655; color: white; font-weight: bold; pointer-events: none; }
        .team-score { font-size: 20px; padding: 0 10px; }
        .blue-team { color: #30cdff; }
        .red-team { color: #ff4655; }
        #timer { font-size: 18px; background: #111; padding: 3px 8px; border-radius: 3px; margin: 0 10px; }

        /* Kill Feed */
        #kill-feed { position: absolute; top: 10px; right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .kill-item { background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 3px; font-size: 11px; color: white; border-left: 4px solid #ff4655; }

        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; z-index: 4; pointer-events: none; }
        .ch-line { position: absolute; background: #00ff00; }
        .ch-h { top: 5px; left: 0; width: 12px; height: 2px; }
        .ch-v { top: 0; left: 5px; width: 2px; height: 12px; }

        /* HUD Alt Alan */
        #hud-bottom { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 10px; pointer-events: none; }
        .hud-stat { background: rgba(15,25,35,0.85); color: white; padding: 5px 15px; border-radius: 4px; border: 1px solid #333; font-weight: bold; font-size: 12px; }
        .stat-val { font-size: 18px; color: #ff4655; }

        /* Yetenekler */
        #ability-bar { position: absolute; bottom: 10px; left: 15px; z-index: 5; display: flex; gap: 5px; pointer-events: none; }
        .ability-slot { width: 40px; height: 40px; background: rgba(15,25,35,0.9); border: 1px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; font-weight: bold; }

        /* MOBİL DOKUNMATİK KONTROLLER */
        .joystick-zone { position: absolute; bottom: 15px; left: 15px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border-radius: 50%; z-index: 6; touch-action: none; border: 1px solid rgba(255,255,255,0.1); }
        .joystick-stick { position: absolute; top: 40px; left: 40px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border-radius: 50%; }
        
        /* Sağ Kamera Alanı (Görünmez Panel) */
        #touch-look-zone { position: absolute; top: 0; right: 0; width: 65%; height: 100%; z-index: 2; touch-action: none; }

        /* Sağ Aksiyon Butonları */
        .btn-game { position: absolute; z-index: 6; background: rgba(15,25,35,0.85); color: white; border: 1px solid #444; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 50%; touch-action: none; font-size: 12px; }
        .btn-game:active { background: #ff4655; }
        #btn-shoot { bottom: 20px; right: 120px; width: 75px; height: 75px; background: rgba(255, 70, 85, 0.7); font-size: 14px; border: 2px solid #ff4655; }
        #btn-ads { bottom: 105px; right: 130px; width: 45px; height: 45px; font-size: 10px; }
        #btn-jump { bottom: 85px; right: 20px; width: 50px; height: 50px; font-size: 10px; }
        #btn-crouch { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 10px; }
        #btn-reload { bottom: 145px; right: 25px; width: 45px; height: 45px; font-size: 11px; background: #333; }
        #btn-switch { bottom: 200px; right: 30px; width: 40px; height: 40px; font-size: 9px; background: #222; }

        #round-screen { background: rgba(0,0,0,0.8); font-size: 24px; font-weight: bold; pointer-events: none; z-index: 12; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="touch-look-zone"></div>

    <div id="setup-screen" class="screen">
        <h2 style="font-size: 24px; color: #ff4655; letter-spacing: 1px;">VALORANT MOBILE</h2>
        <p style="font-size: 13px; opacity: 0.7; margin-top: 5px;">Bir Ajan Seçip Maçı Başlatın</p>
        <div class="agent-grid" id="agent-selector"></div>
        <button class="btn" id="start-match-btn">MAÇI BAŞLAT</button>
    </div>

    <div id="round-screen" class="screen hidden">
        <div id="round-title">RAUNT 1</div>
    </div>

    <div id="mvp-screen" class="screen hidden">
        <h2 id="winner-team" style="color: #ffb700;">MAVİ TAKIM KAZANDI</h2>
        <p id="mvp-name" style="margin: 10px 0; font-size: 20px;">MVP: JETT</p>
        <button class="btn" onclick="location.reload()">Yeniden Oyna</button>
    </div>

    <div id="hud-top">
        <span class="blue-team" id="score-blue">0</span>
        <span style="opacity:0.5; margin: 0 5px;">-</span>
        <span class="red-team" id="score-red">0</span>
        <div id="timer">100</div>
        <div id="alive-text" style="font-size: 12px;">5 VS 5</div>
    </div>

    <div id="kill-feed"></div>
    <div id="crosshair"><div class="ch-line ch-h"></div><div class="ch-line ch-v"></div></div>

    <div id="ability-bar">
        <div class="ability-slot" id="ab-1">Q</div>
        <div class="ability-slot" id="ab-2">E</div>
        <div class="ability-slot" id="ab-3">C</div>
        <div class="ability-slot" id="ab-4" style="border-color:#ffb700;">X</div>
    </div>

    <div id="hud-bottom">
        <div class="hud-stat">CAN <span class="stat-val" id="hp-display">100</span></div>
        <div class="hud-stat">ZIRH <span class="stat-val" style="color:#30cdff">50</span></div>
        <div class="hud-stat"><span id="weapon-display">VANDAL</span> <span id="ammo-display" style="color:#ffb700; margin-left:5px;">30/90</span></div>
    </div>

    <div class="joystick-zone" id="joy-zone"><div class="joystick-stick" id="joy-stick"></div></div>
    <div class="btn-game" id="btn-shoot">ATEŞ</div>
    <div class="btn-game" id="btn-ads">ADS</div>
    <div class="btn-game" id="btn-jump">ZIPLA</div>
    <div class="btn-game" id="btn-crouch">EĞİL</div>
    <div class="btn-game" id="btn-reload">R</div>
    <div class="btn-game" id="btn-switch">SİLAH</div>

    <script>
        const WEAPONS = {
            KNIFE: { name: "Knife", damage: 50, recoil: 0, clip: 1, reload: 0, hsMult: 1 },
            CLASSIC: { name: "Classic", damage: 26, recoil: 1, clip: 12, reload: 1500, hsMult: 3 },
            SPECTRE: { name: "Spectre", damage: 26, recoil: 1.1, clip: 30, reload: 2000, hsMult: 3 },
            VANDAL: { name: "Vandal", damage: 40, recoil: 1.6, clip: 25, reload: 2500, hsMult: 4 },
            OPERATOR: { name: "Operator", damage: 150, recoil: 4, clip: 5, reload: 3500, hsMult: 3 }
        };

        const AGENTS = [
            { name: "Jett", ab: "Dash", color: 0x66cdaa },
            { name: "Phoenix", ab: "Flash", color: 0xff4500 },
            { name: "Sova", ab: "Recon", color: 0x1e90ff },
            { name: "Reyna", ab: "Heal", color: 0xba55d3 }
        ];

        let selectedAgent = AGENTS[0];
        let scoreBlue = 0, scoreRed = 0, currentRound = 1;
        let matchActive = false, roundActive = false, roundTimer = 100;
        let killsRegistry = {};

        let scene, camera, renderer, playerObj;
        let entities = [];
        let moveInput = { x: 0, y: 0 };
        let playerRotation = { yaw: 0, pitch: 0 };
        let currentWeaponKey = "VANDAL";
        let ammoCount = WEAPONS.VANDAL.clip;
        let isADS = false, isCrouching = false;

        // Ajanları listeleme mekanizması esnek hale getirildi
        const selector = document.getElementById("agent-selector");
        AGENTS.forEach((agent, i) => {
            const card = document.createElement("div");
            card.className = `agent-card ${i === 0 ? 'selected' : ''}`;
            card.innerHTML = `<b>${agent.name}</b><br><span style="font-size:9px;opacity:0.6;">${agent.ab}</span>`;
            card.onclick = () => {
                document.querySelectorAll(".agent-card").forEach(c => c.classList.remove("selected"));
                card.classList.add("selected");
                selectedAgent = agent;
            };
            selector.appendChild(card);
        });

        // Butona basıldığında doğrudan sahne oluşturuluyor
        document.getElementById("start-match-btn").onclick = () => {
            document.getElementById("setup-screen").classList.add("hidden");
            initGame();
        };

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x11161b);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById("canvas-container").appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(10, 30, 10);
            scene.add(sun);

            buildMap();
            spawnEntities();
            setupControls();

            matchActive = true;
            startRound();
            animate();
        }

        function buildMap() {
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x22262e });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const boxGeo = new THREE.BoxGeometry(10, 8, 10);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x3a404a });
            for(let i = 0; i < 6; i++) {
                const mesh = new THREE.Mesh(boxGeo, boxMat);
                mesh.position.set((Math.random() - 0.5) * 80, 4, (Math.random() - 0.5) * 80);
                scene.add(mesh);
            }
        }

        function spawnEntities() {
            entities = [];
            killsRegistry = {};

            playerObj = {
                isBot: false, team: "BLUE", name: "Sen", agent: selectedAgent,
                hp: 100, pos: new THREE.Vector3(0, 2, 40), weapon: WEAPONS[currentWeaponKey]
            };
            entities.push(playerObj);
            killsRegistry[playerObj.name] = 0;

            for (let i = 1; i <= 5; i++) {
                let botAgent = AGENTS[Math.floor(Math.random() * AGENTS.length)];
                let name = `Düşman_${i}`;
                killsRegistry[name] = 0;

                const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 2, 8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4655 });
                const mesh = new THREE.Mesh(bodyGeo, bodyMat);
                mesh.position.set((i - 3) * 12, 1, -40);
                scene.add(mesh);

                entities.push({
                    isBot: true, team: "RED", name: name, agent: botAgent,
                    hp: 100, pos: mesh.position, mesh: mesh, weapon: WEAPONS.VANDAL, aiTimer: 0
                });
            }
        }

        function startRound() {
            roundActive = true;
            roundTimer = 100;

            playerObj.hp = 100;
            playerObj.pos.set(0, 2, 45);
            camera.position.copy(playerObj.pos);
            ammoCount = playerObj.weapon.clip;

            entities.forEach(e => {
                if(e.isBot) {
                    e.hp = 100;
                    e.mesh.visible = true;
                    e.pos.set((Math.random() - 0.5) * 50, 1, -40);
                }
            });

            const screen = document.getElementById("round-screen");
            document.getElementById("round-title").innerText = `RAUNT ${currentRound}`;
            screen.classList.remove("hidden");
            setTimeout(() => screen.classList.add("hidden"), 1500);

            updateHUD();
        }

        function endRound(winner) {
            roundActive = false;
            if (winner === "BLUE") scoreBlue++; else scoreRed++;

            document.getElementById("score-blue").innerText = scoreBlue;
            document.getElementById("score-red").innerText = scoreRed;

            if (scoreBlue >= 3 || scoreRed >= 3) {
                matchActive = false;
                document.getElementById("mvp-screen").classList.remove("hidden");
                let maxKills = 0, mvp = playerObj.name;
                for(let k in killsRegistry) {
                    if(killsRegistry[k] >= maxKills) { maxKills = killsRegistry[k]; mvp = k; }
                }
                document.getElementById("winner-team").innerText = winner === "BLUE" ? "MAVİ TAKIM KAZANDI" : "KIRMIZI TAKIM KAZANDI";
                document.getElementById("mvp-name").innerText = `MVP: ${mvp} (${maxKills} Leş)`;
            } else {
                currentRound++;
                setTimeout(startRound, 2000);
            }
        }

        function shoot() {
            if (ammoCount <= 0) return;
            ammoCount--;
            updateHUD();

            playerRotation.pitch += 0.02;

            let raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            let targets = entities.filter(e => e.isBot && e.hp > 0).map(e => e.mesh);
            let hits = raycaster.intersectObjects(targets);

            if (hits.length > 0) {
                let hitBot = entities.find(e => e.mesh === hits[0].object);
                if (hitBot) {
                    hitBot.hp -= playerObj.weapon.damage;
                    if (hitBot.hp <= 0) {
                        hitBot.mesh.visible = false;
                        killsRegistry[playerObj.name]++;
                        pushKillFeed(playerObj.name, hitBot.name);
                    }
                }
            }
        }

        function pushKillFeed(k, v) {
            const f = document.getElementById("kill-feed");
            const i = document.createElement("div");
            i.className = "kill-item";
            i.innerText = `${k} ⚔️ ${v}`;
            f.appendChild(i);
            setTimeout(() => i.remove(), 3000);
        }

        function setupControls() {
            const zone = document.getElementById("joy-zone");
            const stick = document.getElementById("joy-stick");
            let joyActive = false, startPos = { x: 0, y: 0 };

            zone.addEventListener("touchstart", (e) => {
                joyActive = true;
                startPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            window.addEventListener("touchmove", (e) => {
                if (!joyActive) return;
                let t = e.touches[0];
                let dx = t.clientX - startPos.x;
                let dy = t.clientY - startPos.y;
                let d = Math.hypot(dx, dy);
                if (d > 35) { dx = (dx / d) * 35; dy = (dy / d) * 35; }
                
                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                moveInput.x = dx / 35;
                moveInput.y = -dy / 35;
            });

            window.addEventListener("touchend", () => {
                joyActive = false;
                stick.style.transform = "translate(0px, 0px)";
                moveInput = { x: 0, y: 0 };
            });

            const lookZone = document.getElementById("touch-look-zone");
            let lastLook = { x: 0, y: 0 }, lookActive = false;

            lookZone.addEventListener("touchstart", (e) => {
                lookActive = true;
                lastLook = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            lookZone.addEventListener("touchmove", (e) => {
                if (!lookActive) return;
                let t = e.touches[0];
                let dx = t.clientX - lastLook.x;
                let dy = t.clientY - lastLook.y;

                playerRotation.yaw -= dx * 0.006;
                playerRotation.pitch -= dy * 0.006;
                playerRotation.pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, playerRotation.pitch));

                lastLook = { x: t.clientX, y: t.clientY };
            });

            lookZone.addEventListener("touchend", () => { lookActive = false; });

            document.getElementById("btn-shoot").addEventListener("touchstart", (e) => { e.preventDefault(); shoot(); });
            document.getElementById("btn-reload").addEventListener("touchstart", (e) => {
                e.preventDefault();
                ammoCount = playerObj.weapon.clip;
                updateHUD();
            });
            document.getElementById("btn-switch").addEventListener("touchstart", (e) => {
                e.preventDefault();
                let keys = Object.keys(WEAPONS);
                let next = (keys.indexOf(currentWeaponKey) + 1) % keys.length;
                currentWeaponKey = keys[next];
                playerObj.weapon = WEAPONS[currentWeaponKey];
                ammoCount = playerObj.weapon.clip;
                updateHUD();
            });
            document.getElementById("btn-ads").addEventListener("touchstart", (e) => {
                e.preventDefault();
                isADS = !isADS;
                camera.fov = isADS ? 35 : 70;
                camera.updateProjectionMatrix();
            });
        }

        function updateHUD() {
            document.getElementById("hp-display").innerText = playerObj.hp;
            document.getElementById("weapon-display").innerText = playerObj.weapon.name.toUpperCase();
            document.getElementById("ammo-display").innerText = `${ammoCount}/${playerObj.weapon.clip * 3}`;
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (!matchActive) return;

            const delta = clock.getDelta();

            roundTimer -= delta;
            if(roundTimer <= 0 && roundActive) { endRound("RED"); }
            document.getElementById("timer").innerText = Math.floor(roundTimer);

            if (playerObj.hp > 0) {
                camera.rotation.order = "YXZ";
                camera.rotation.y = playerRotation.yaw;
                camera.rot
