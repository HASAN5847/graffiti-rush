<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZıpZıp Dünyası - Sunucu Seçimi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c1020;
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .box {
            border: 3px solid #00bcff;
            padding: 30px;
            display: inline-block;
            border-radius: 16px;
            background-color: #121829;
            max-width: 500px;
            width: 100%;
            box-shadow: 0px 0px 25px rgba(0, 188, 255, 0.2);
        }
        h1 { color: #00bcff; font-size: 28px; margin-bottom: 10px; }
        p { color: #bcc1d5; font-size: 16px; }
        
        select, button {
            padding: 14px 20px;
            font-size: 16px;
            margin-top: 20px;
            border-radius: 10px;
            border: none;
            width: 85%;
            box-sizing: border-box;
        }
        select { background-color: #1a233d; color: white; border: 1px solid #00bcff; }
        button { 
            background-color: #00bcff; 
            color: #0c1020; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 18px;
            transition: 0.2s;
        }
        button:hover { background-color: #33ccff; transform: scale(1.02); }
        iframe { border: 3px solid #00bcff; margin-top: 20px; border-radius: 12px; width: 100%; height: 350px; }
        .gizli { display: none; }
        .mesaj { color: #ffeb3b; font-size: 24px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <!-- 1. EKRAAN: Şehir Seçme -->
        <div id="ekran1">
            <h1>🎮 Sunucu Bölgesi</h1>
            <p>ZıpZıp Dünyası'na bağlanıyorsunuz. Ping değerinizin düşmesi için lütfen bulunduğunuz şehri seçin:</p>
            
            <select id="sehirSec">
                <option value="İstanbul">İstanbul</option>
                <option value="Ankara">Ankara</option>
                <option value="İzmir">İzmir</option>
                <option value="Bursa">Bursa</option>
                <option value="Antalya">Antalya</option>
            </select>
            <br>
            <button onclick="haritayiAc()">OYUNA BAĞLAN</button>
        </div>

        <!-- 2. EKRAN: Harita ve Sürpriz Mesaj -->
        <div id="ekran2" class="gizli">
            <h1>Buldum Seni! 🎯</h1>
            <div class="mesaj" id="yazi">burası tanıdıkmi xd</div>
            <div id="haritaYeri"></div>
        </div>
    </div>

    <script>
        function haritayiAc() {
            var secilen = document.getElementById("sehirSec").value;
            
            document.getElementById("ekran1").style.display = "none";
            document.getElementById("ekran2").style.display = "block";
            
            // Seçtiği şehri haritada açıyoruz
            var haritaUrl = "https://maps.google.com/maps?q=" + encodeURIComponent(secilen) + "&t=&z=12&ie=UTF-8&iwloc=&output=embed";
            document.getElementById("haritaYeri").innerHTML = '<iframe src="' + haritaUrl + '"></iframe>';
        }
    </script>

</body>
</html>
